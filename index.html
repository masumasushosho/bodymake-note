<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>痩せ体質完成ノート</title>
<!-- LIFF SDK（LINE公式。開いた人が誰かを判別するために必須） -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* ===== 設定色（ボディメイクプラスのロゴから取る） ===== */
  :root{
    --bg:#f4f9fd;          /* 下半身の水色を薄くしたもの */
    --card:#ffffff;
    --ink:#3a5578;         /* 体のラインの濃い青 */
    --sub:#8399b5;         /* 補助文字 */
    --line:#dce9f4;
    --accent:#ec3b78;      /* リング右下のピンク */
    --accent-weak:#fdeaf1; /* ピンクの薄い面 */
    --sky:#aedcf5;         /* 下半身の水色 */
    --head:linear-gradient(100deg,#f8a98a 0%,#ec3b78 78%);
    --danger:#b3261e;
    --radius:14px;
    /* 4フェーズ（ロゴの水色→青→オレンジ→ピンクの流れ） */
    --ph1:#7cc4e8; --ph2:#5b8fc7; --ph3:#f0996f; --ph4:#ec3b78;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:17px;              /* 本文17px以上 */
    line-height:1.6;
    padding-bottom:150px;         /* 下部固定エリア分の余白 */
    -webkit-text-size-adjust:100%;
  }
  .num{font-variant-numeric:tabular-nums;}   /* 数字の桁を揃える */

  /* ===== ヘッダ ===== */
  header{
    position:sticky;top:0;z-index:5;
    background:var(--head);color:#fff;
    padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    font-size:18px;font-weight:700;letter-spacing:.02em;
  }
  header .hello{font-size:14px;font-weight:400;opacity:.9;margin-top:2px;}

  main{padding:16px;max-width:640px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{margin:0 0 12px;font-size:17px;}
  .muted{color:var(--sub);}
  .empty{color:var(--sub);text-align:center;padding:28px 8px;}

  /* ===== 入力行 ===== */
  .field{margin-bottom:16px;}
  .field > label{display:block;font-size:16px;margin-bottom:6px;font-weight:600;}
  .field .unit{color:var(--sub);font-size:15px;margin-left:6px;font-weight:400;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;font-size:17px;color:var(--ink);background:#fbfdfb;
    border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:52px;
  }
  textarea{min-height:88px;resize:vertical;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}

  /* 大きな選択ボタン（体調・運動・活動レベルなど） */
  .choices{display:flex;gap:8px;flex-wrap:wrap;}
  .choice{
    flex:1 1 auto;min-width:52px;min-height:52px;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line);border-radius:12px;background:#fbfdfb;
    font-size:17px;font-weight:600;cursor:pointer;user-select:none;padding:8px 10px;
  }
  .choice.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* 縦並びの選択（体調のように言葉が長いもの） */
  .choices.vert{flex-direction:column;}
  .choices.vert .choice{width:100%;justify-content:flex-start;gap:10px;padding:12px 14px;}
  .choices.vert .choice .n{min-width:26px;font-size:15px;color:var(--sub);}
  .choices.vert .choice.on .n{color:#fff;}
  /* 入力欄の下に出す小さな注意書き */
  .note{font-size:14px;color:var(--sub);line-height:1.5;margin-top:6px;}

  /* 計算結果の表示ボックス */
  .calc{background:var(--accent-weak);border-radius:12px;padding:12px 14px;margin-top:6px;}
  .calc .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #cfe0d6;}
  .calc .row:last-child{border-bottom:none;}
  .calc .big{font-size:20px;font-weight:700;color:var(--accent);}

  /* ===== 姿勢写真グリッド ===== */
  .progress{font-size:22px;font-weight:700;text-align:center;margin:6px 0 14px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  /* ポーズ1つ＝1ブロック。右と左を横に2つ並べる（原本のシートと同じ並び） */
  .pose-row{margin-bottom:16px;}
  .pose-head{margin-bottom:6px;}
  .pose-name{font-size:16px;font-weight:700;}
  .pose-name .pno{color:var(--sub);font-weight:600;font-size:14px;margin-right:6px;}
  .pose-tip{display:block;font-size:14px;color:var(--sub);line-height:1.5;margin-top:2px;}
  .pair{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .pair.single{grid-template-columns:1fr;}
  .slot .dir{font-size:15px;font-weight:700;color:var(--ink);}
  /* お手本写真。画像が置かれていないときは onerror で消える */
  .sample{display:block;width:100%;max-width:320px;margin:0 auto 8px;border-radius:10px;border:1px solid var(--line);}
  .slot{
    position:relative;aspect-ratio:3/4;border:1.5px solid var(--line);border-radius:12px;
    background:#f4f8f5;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:4px;
  }
  .slot .no{position:absolute;top:4px;left:6px;font-size:13px;font-weight:700;color:var(--sub);}
  .slot .cap{font-size:12px;color:var(--sub);line-height:1.3;}
  .slot img{width:100%;height:100%;object-fit:cover;}
  .slot.done{border-color:var(--accent);}
  .slot .check{position:absolute;top:4px;right:6px;width:22px;height:22px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;}

  /* ===== 表（推移） ===== */
  table{width:100%;border-collapse:collapse;font-size:16px;}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;}
  th:first-child,td:first-child{text-align:left;}
  thead th{color:var(--sub);font-weight:600;font-size:14px;}

  /* ===== 下部固定：保存ボタン＋タブ ===== */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:6;}
  .savebar{padding:10px 16px;background:linear-gradient(to top,var(--bg),rgba(238,242,238,.0));}
  .btn-save{
    width:100%;max-width:608px;margin:0 auto;display:block;
    background:var(--accent);color:#fff;border:none;border-radius:14px;
    font-size:19px;font-weight:700;min-height:56px;cursor:pointer;box-shadow:0 4px 14px rgba(31,107,77,.25);
  }
  .btn-save:disabled{opacity:.5;}
  .btn-sub{
    width:100%;margin-top:10px;background:#fff;color:var(--accent);border:1.5px solid var(--accent);
    border-radius:14px;font-size:17px;font-weight:700;min-height:52px;cursor:pointer;
  }
  .tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font-size:12px;color:var(--sub);cursor:pointer;background:none;border:none;}
  .tab .ico{font-size:22px;line-height:1;}
  .tab.on{color:var(--accent);font-weight:700;}

  /* ===== トースト ===== */
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:16px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== 全画面ローディング ===== */
  .loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;z-index:20;}
  .spinner{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}

  /* ヘッダー右の設定ボタン（カルテはここから開く） */
  header{position:relative;}
  .gear{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:rgba(255,255,255,.18);border:none;color:#fff;font-size:20px;
    width:44px;height:44px;border-radius:12px;cursor:pointer;}
  /* ===== 宿題（リフォームEX） ===== */
  .hw-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .hw-set{font-weight:700;font-size:18px;}
  .hw-given{color:var(--sub);font-size:14px;}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:14px;margin-bottom:14px;}
  .ex-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .ex-id{font-size:13px;font-weight:700;color:#fff;background:var(--sub);
         border-radius:20px;padding:3px 10px;letter-spacing:.03em;}
  .ex-id.p1{background:var(--ph1);} .ex-id.p2{background:var(--ph2);}
  .ex-id.p3{background:var(--ph3);} .ex-id.p4{background:var(--ph4);}
  .ex-body{font-size:14px;color:var(--sub);}
  .ex-reps{margin-left:auto;font-size:15px;font-weight:700;}
  /* 写真は原本と同じく横1列。左から右の順に番号を振る */
  .shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .shot{position:relative;flex:0 0 auto;width:132px;}
  .shot img{width:132px;height:132px;object-fit:cover;border-radius:10px;
            border:1px solid var(--line);background:#fff;display:block;}
  .shot .n{position:absolute;left:6px;top:6px;min-width:22px;height:22px;border-radius:11px;
           background:rgba(58,85,120,.86);color:#fff;font-size:13px;font-weight:700;
           display:flex;align-items:center;justify-content:center;padding:0 6px;}
  .ex-how{margin-top:10px;font-size:16px;line-height:1.65;}
  /* できたは曜日ごとに7つ */
  .days{display:flex;gap:6px;margin-top:12px;}
  .day{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;
       padding:7px 0 6px;text-align:center;cursor:pointer;font-size:12px;color:var(--sub);
       line-height:1.25;}
  .day .d{font-size:11px;}
  .day .m{font-size:18px;line-height:1.1;height:20px;}
  .day.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .day.today{border-color:var(--accent);border-width:2px;}
  /* まっすー用 */
  .pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .pick select,.pick input{flex:1;min-width:120px;}
  .stu{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .stu .nm{font-weight:700;}
  .stu .mt{margin-left:auto;font-size:13px;color:var(--sub);text-align:right;}
  .row-ex{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .row-ex img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .row-ex .tx{flex:1;min-width:0;font-size:14px;line-height:1.45;
              display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .row-ex button{flex:0 0 auto;}
  .mini{font-size:14px;padding:7px 12px;border-radius:9px;border:1px solid var(--accent);
        background:#fff;color:var(--accent);font-weight:700;cursor:pointer;}
  .mini.fill{background:var(--accent);color:#fff;}
</style>
</head>
<body>

<!-- 起動中ローディング -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <div class="muted">読み込んでいます…</div>
</div>

<header>
  痩せ体質完成ノート
  <div class="hello" id="hello"></div>
  <button class="gear" id="btnKarte" title="カルテ">⚙</button>
  <button class="gear hidden" id="btnCoach" title="まっすー用" style="right:52px;">👥</button>
</header>

<main>
  <!-- 画面1：今日の記録 -->
  <section id="view-record" class="view"></section>
  <!-- 画面2：姿勢写真 -->
  <section id="view-photo" class="view hidden"></section>
  <!-- 画面3：カルテ -->
  <section id="view-karte" class="view hidden"></section>
  <!-- 画面4：推移 -->
  <section id="view-trend" class="view hidden"></section>

  <section id="view-homework" class="view hidden"></section>

  <section id="view-coach" class="view hidden"></section>
</main>

<!-- 下部固定：保存ボタン（画面ごとに出し分け）＋タブ -->
<div class="dock">
  <div id="savebar" class="savebar"></div>
  <nav class="tabs">
    <button class="tab on" data-view="record"><span class="ico">✏️</span>今日の記録</button>
    <button class="tab" data-view="homework"><span class="ico">🏋️</span>宿題</button>
    <button class="tab" data-view="photo"><span class="ico">📷</span>姿勢写真</button>
    <button class="tab" data-view="trend"><span class="ico">📈</span>推移</button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<!-- 写真選択用の隠しinput -->
<input type="file" id="filePick" accept="image/*" class="hidden">
<input type="file" id="fileMulti" accept="image/*" multiple class="hidden">
<input type="file" id="fileEx" accept="image/*" multiple class="hidden">

<script>
/* ================= 設定（増田さんが貼り替える2つ） ================= */
var CONFIG = {
  LIFF_ID: '2011268566-JqNKAkur',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbz-YyCsJ2su_IviYAWogU92SrxAZ4Vne52mYFtQ29zp8f8dm3m8V3JJW5q7rDq8pXsr/exec'
};

/* ================= 共通状態 ================= */
var S = { idToken:null, name:'', today:'', shootDates:[], round:1, karte:null };

/* ================= サーバー通信 ================= */
function api(action, payload){
  var body = Object.assign({ action:action, idToken:S.idToken }, payload || {});
  return fetch(CONFIG.GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},  // プリフライトを避ける
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); }).then(function(res){
    if(!res.ok) throw new Error(res.error || 'server error');
    return res.data;
  });
}

/* ================= 画面ユーティリティ ================= */
function $(id){ return document.getElementById(id); }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },1800);
}
function showView(name){
  ['record','photo','karte','trend','homework','coach'].forEach(function(v){
    $('view-'+v).classList.toggle('hidden', v!==name);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.classList.toggle('on', b.dataset.view===name);
  });
  $('savebar').innerHTML='';
  if(name==='record') renderRecordSave();
  if(name==='karte') renderKarteSave();
  if(name==='photo') renderPhotoSave();
  window.scrollTo(0,0);
}

/* ================= 起動 ================= */
function boot(){
  if(!window.liff){ fail('つながりませんでした。もう一度開いてください'); return; }
  liff.init({ liffId: CONFIG.LIFF_ID }).then(function(){
    if(!liff.isLoggedIn()){ liff.login(); return; }
    S.idToken = liff.getIDToken();
    return api('bootstrap', {});
  }).then(function(d){
    if(!d) return;
    S.name=d.name; S.today=d.today; S.shootDates=d.shootDates||[]; S.isCoach=!!d.isCoach;
    if(S.isCoach) $('btnCoach').classList.remove('hidden');
    $('hello').textContent = d.name ? (d.name+' さん') : 'ようこそ';
    renderRecord(d.todayDiary);
    $('loading').classList.add('hidden');
    setupTabs();
    showView('record');
  }).catch(function(e){
    fail('読み込みに失敗しました。電波の良い場所でもう一度お試しください');
  });
}
function fail(msg){
  $('loading').innerHTML='<div class="empty">'+msg+'</div>';
}
function setupTabs(){
  $('btnKarte').addEventListener('click',function(){ loadKarte(); showView('karte'); });
  $('btnCoach').addEventListener('click',function(){ loadCoach(); showView('coach'); });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.addEventListener('click',function(){
      var v=b.dataset.view;
      if(v==='photo') loadPhotos(S.round);
      if(v==='homework') loadHomework();
      if(v==='karte') loadKarte();
      if(v==='trend') loadTrend();
      showView(v);
    });
  });
}

/* ============================================================
 * 画面1：今日の記録
 * ============================================================ */
var RECORD_FIELDS = [
  {key:'体重', unit:'kg', step:'0.1', mode:'decimal'},
  {key:'ウエスト', unit:'cm', step:'0.1', mode:'decimal'},
  {key:'右もも', unit:'cm', step:'0.1', mode:'decimal'},
  {key:'左もも', unit:'cm', step:'0.1', mode:'decimal'},
  {key:'歩数', unit:'歩', step:'1', mode:'numeric'}
];
/* カテ1〜3は量を数えず、3つから選ぶ。名前は栄養コンシェルジュの教材に合わせる
   （シートの列名は原本どおり カテ1/カテ2/カテ3 のまま保存する） */
var CATE_FIELDS = [
  {key:'カテ1', label:'カテゴリー1　炭水化物'},
  {key:'カテ2', label:'カテゴリー2　タンパク質'},
  {key:'カテ3', label:'カテゴリー3　野菜'}
];
var CATE_KEYS = CATE_FIELDS.map(function(f){ return f.key; });
var CATE_OPTS = ['少ない','適量','多すぎた'];
/* 体調は数字だけだと分かりにくいので言葉をつける */
var COND_OPTS = [['1','絶不調'],['2','不調'],['3','普通'],['4','好調'],['5','絶好調']];
function renderRecord(diary){
  diary = diary || {};
  var html='<div class="card"><h2>今日の記録　<span class="muted num">'+S.today+'</span></h2>';
  RECORD_FIELDS.forEach(function(f){
    var v = diary[f.key]!=null ? diary[f.key] : '';
    html+='<div class="field"><label>'+f.key+'<span class="unit">'+f.unit+'</span></label>'+
      '<input type="number" inputmode="'+f.mode+'" step="'+f.step+'" id="rec_'+f.key+'" class="num" value="'+esc(v)+'"></div>';
  });
  // カテ1〜3（少ない／適量／多すぎた）
  CATE_FIELDS.forEach(function(f){
    html+='<div class="field"><label>'+f.label+'</label><div class="choices" id="rec_'+f.key+'">';
    CATE_OPTS.forEach(function(o){ html+='<div class="choice" data-val="'+o+'">'+o+'</div>'; });
    html+='</div></div>';
  });
  // 体調（言葉つきの5段階。縦に並べて読みやすく）
  html+='<div class="field"><label>体調</label><div class="choices vert" id="rec_体調">';
  COND_OPTS.forEach(function(o){
    html+='<div class="choice" data-val="'+o[0]+'"><span class="n">'+o[0]+'</span>'+o[1]+'</div>';
  });
  html+='</div></div>';
  // 運動
  html+='<div class="field"><label>運動</label><div class="choices" id="rec_運動">'+
    '<div class="choice" data-val="した">した</div><div class="choice" data-val="していない">していない</div></div>'+
    '<div class="note">完全にゼロの日は作らないようにしましょう。1分のストレッチでも「した」でOKです</div></div>';
  // 気づき
  html+='<div class="field"><label>その日の気づき</label>'+
    '<textarea id="rec_気づき" placeholder="ひとことでもOKです">'+esc(diary['その日の気づき']||'')+'</textarea></div>';
  html+='</div>';
  $('view-record').innerHTML=html;

  CATE_KEYS.forEach(function(k){ bindChoices('rec_'+k, diary[k]); });
  bindChoices('rec_体調', diary['体調']);
  bindChoices('rec_運動', diary['運動']);
}
function bindChoices(groupId, current){
  var g=$(groupId); if(!g) return;
  Array.prototype.forEach.call(g.children,function(c){
    if(String(c.dataset.val)===String(current)) c.classList.add('on');
    c.addEventListener('click',function(){
      Array.prototype.forEach.call(g.children,function(x){x.classList.remove('on');});
      c.classList.add('on');
    });
  });
}
function renderRecordSave(){
  $('savebar').innerHTML='<button class="btn-save" id="btnSaveRecord">保存する</button>';
  $('btnSaveRecord').addEventListener('click', saveRecord);
}
function saveRecord(){
  var btn=$('btnSaveRecord'); btn.disabled=true; btn.textContent='保存中…';
  var data={ date:S.today };
  RECORD_FIELDS.forEach(function(f){ data[f.key]=$('rec_'+f.key).value; });
  CATE_KEYS.forEach(function(k){ data[k]=selected('rec_'+k); });

var pickTarget=null;
function pickOne(no, el){
  pickTarget={no:no, el:el};

$('filePick').addEventListener('change',function(){

/* まとめ選択 → 空き枠へ番号順に流し込む */
$('fileMulti').addEventListener('change',function(){
  var files=Array.prototype.slice.call(this.files); if(!files.length) return;
  var empties=PHOTO_STATE.slots.filter(function(s){return !s.filled;}).map(function(s){return s.no;});
  if(!empties.length){ toast('空いている枠がありません'); return; }
  var pairs=[]; for(var i=0;i<files.length && i<empties.length;i++){ pairs.push({file:files[i], no:empties[i]}); }
  toast(pairs.length+'枚を取り込みます');
  var chain=Promise.resolve();
  pairs.forEach(function(p){
    chain=chain.then(function(){
      return shrink(p.file).then(function(b64){
        var el=findSlotEl(p.no);
        return uploadSlot(p.no, b64, el, true);
      });
    });
  });
  chain.then(function(){ toast('取り込みが終わりました'); });
});
function findSlotEl(no){
  var grid=$('photoGrid'); if(!grid) return null;
  return grid.querySelector('.slot[data-no="'+no+'"]');
}

/* 端末側で長辺1600px・JPEG0.8に縮小し base64 を返す（必須処理） */
function shrink(file){
  return new Promise(function(resolve,reject){
    var img=new Image();
    var reader=new FileReader();
    reader.onload=function(){ img.src=reader.result; };
    reader.onerror=reject;
    img.onload=function(){
      var max=1600, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var dataUrl=canvas.toDataURL('image/jpeg',0.8);
      resolve({ dataUrl:dataUrl, base64:dataUrl.split(',')[1] });
    };
    img.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function uploadSlot(no, b64, el, quiet){
  if(el){ el.classList.add('uploading'); }
  return api('uploadPhoto',{ round:PHOTO_STATE.round, no:no, imageBase64:b64.base64 }).then(function(){
    // その場でサムネイル表示（端末が持っている画像を使う。ドライブは非公開のまま）
    if(el){
      el.classList.add('done');
      el.innerHTML='<span class="no">'+no+'</span><span class="check">✓</span>'+
        '<img src="'+b64.dataUrl+'" alt="">';
      el.onclick=function(){ pickOne(no, el); };
    }
    var slot=PHOTO_STATE.slots.filter(function(s){return s.no===no;})[0];
    if(slot) slot.filled=true;
    updateProgress();
    if(!quiet) toast('アップロードしました');
  }).catch(function(){
    if(el) el.classList.remove('uploading');
    alert2('電波の良い場所でもう一度お試しください');
  });
}
function updateProgress(){
  var c=PHOTO_STATE.slots.filter(function(s){return s.filled;}).length;
  var p=document.querySelector('.progress'); if(p) p.textContent=c+' / '+PHOTO_STATE.slots.length+' 枚';
}

  $('btnFind').addEventListener('click', doFind);
  $('btnAssign').addEventListener('click',function(){
    api('coachAssign',{data:{lineId:d.lineId, exIds:S.sel, setName:$('setSel').value||d.setName}})
      .then(function(r){ toast(r.count+'種目 出しました！'); })
      .catch(function(){ toast('保存できませんでした'); });
  });
  window.scrollTo(0,0);
}

function renderSel(){
  var h = S.sel.length ? '' : '<div class="empty">まだ何も入っていません</div>';
  S.sel.forEach(function(id){
    var x=S.selInfo[id]||{id:id,how:'',photos:[]};
    h+='<div class="row-ex">'+((x.photos&&x.photos.length)?'<img src="'+esc(x.photos[0])+'" loading="lazy" alt="">':'')+
       '<div class="tx"><b>'+esc(id)+'</b>　'+esc(x.how||'')+'</div>'+
       '<button class="mini" data-del="'+esc(id)+'">外す</button></div>';
  });
  $('selList').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#selList [data-del]'),function(b){
    b.addEventListener('click',function(){
      S.sel=S.sel.filter(function(x){return x!==b.dataset.del;});
      renderSel();
    });
  });
}

function doFind(){
  $('found').innerHTML='<div class="empty">さがしています…</div>';
  api('coachSearch',{data:{phase:$('fPhase').value, body:$('fBody').value, q:$('fQ').value}}).then(function(r){
    var h = r.total ? '<div class="ex-body" style="margin-top:8px;">'+r.total+'件みつかりました（'+r.items.length+'件まで表示）</div>'
                    : '<div class="empty">見つかりませんでした</div>';
    r.items.forEach(function(x){
      S.selInfo[x.id]=x;
      h+='<div class="row-ex">'+(x.photos.length?'<img src="'+esc(x.photos[0])+'" loading="lazy" alt="">':'')+
         '<div class="tx"><b>'+esc(x.id)+'</b>　'+esc(x.how)+'</div>'+
         '<button class="mini fill" data-add="'+esc(x.id)+'">足す</button></div>';
    });
    $('found').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('#found [data-add]'),function(b){
      b.addEventListener('click',function(){
        if(S.sel.indexOf(b.dataset.add)<0){ S.sel.push(b.dataset.add); renderSel(); toast('足しました'); }
        else toast('もう入っています');
      });
    });
  }).catch(function(){ $('found').innerHTML='<div class="empty">さがせませんでした</div>'; });
}

/* --- 種目を新しく作る --- */
function renderNewEx(){
  var c=S.coach;
  S.newPhotos=[];
  var h='<div class="card"><div class="hw-head"><span class="hw-set">種目を新しく作る</span></div>'+
        '<button class="mini" id="btnBack2">← もどる</button></div><div class="card">'+
     '<div class="field"><label>写真（5枚まで。左から順に1、2、3…になります）</label>'+
     '<button class="btn-sub" id="btnPickEx">写真を選ぶ</button>'+
     '<div class="shots" id="newShots" style="margin-top:10px;"></div></div>'+
     '<div class="field"><label>やり方</label>'+
     '<textarea id="nHow" placeholder="動きの手順を書いてください"></textarea></div>'+
     '<div class="pick"><input type="text" id="nReps" placeholder="回数（例 10回）">'+
     '<input type="text" id="nSets" placeholder="セット数（例 2セット）"></div>'+
     '<div class="field"><label>フェーズ</label><select id="nPhase"><option value="">選んでください</option>';
  c.phases.forEach(function(x){ h+='<option>'+esc(x)+'</option>'; });
  h+='</select></div><div class="field"><label>部位（メイン）</label><select id="nBody"><option value="">選んでください</option>';
  c.bodies.forEach(function(x){ h+='<option>'+esc(x)+'</option>'; });
  h+='</select></div><div class="field"><label>部位（サブ。効いている所を3つまで）</label><div class="pick">';
  ['nSub1','nSub2','nSub3'].forEach(function(id){
    h+='<select id="'+id+'"><option value="">なし</option>';
    c.bodies.forEach(function(x){ h+='<option>'+esc(x)+'</option>'; });
    h+='</select>';
  });
  h+='</div></div><button class="btn-save" id="btnSaveEx" style="margin-top:12px;">この種目を登録する</button></div>';
  $('view-coach').innerHTML=h;
  $('btnBack2').addEventListener('click', renderCoachHome);
  $('btnPickEx').addEventListener('click',function(){ $('fileEx').click(); });
  $('btnSaveEx').addEventListener('click', saveNewEx);
  window.scrollTo(0,0);
}

$('fileEx').addEventListener('change',function(){
  var files=Array.prototype.slice.call(this.files); if(!files.length) return;
  var room=5-(S.newPhotos||[]).length;
  if(room<=0){ toast('写真は5枚までです'); return; }
  var chain=Promise.resolve();
  files.slice(0,room).forEach(function(f){
    chain=chain.then(function(){
      return shrink(f).then(function(b){ S.newPhotos.push(b); drawNewShots(); });
    });
  });
  this.value='';
});

function drawNewShots(){
  var h='';
  (S.newPhotos||[]).forEach(function(b,i){
    h+='<div class="shot"><img src="'+b.dataUrl+'" alt=""><span class="n">'+(i+1)+'</span></div>';
  });
  var el=$('newShots'); if(el) el.innerHTML=h;
}

function saveNewEx(){
  var how=$('nHow').value.trim();
  if(how.length<4){ toast('やり方を書いてください'); return; }
  var sub=['nSub1','nSub2','nSub3'].map(function(id){ return $(id).value; })
          .filter(function(x){ return x; });
  $('btnSaveEx').disabled=true;
  toast('登録しています…');
  api('coachAddEx',{data:{
    how:how, reps:$('nReps').value, sets:$('nSets').value,
    phase:$('nPhase').value, body:$('nBody').value, sub:sub,
    photos:(S.newPhotos||[]).map(function(b){ return b.base64; })
  }}).then(function(r){
    toast(r.id+' で登録しました');
    renderCoachHome();
  }).catch(function(e){
    $('btnSaveEx').disabled=false;
    toast(String(e.message||'登録できませんでした'));
  });
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function alert2(msg){ toast(msg); }

/* 起動 */
boot();
</script>
</body>
</html>
