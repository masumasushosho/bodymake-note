<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>痩せ体質完成ノート</title>
<!-- つなぎ先を先に開いておく。最初の1回で接続の準備を済ませておくと、
     本番の通信を待たずにすむ -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://drive.google.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<!-- LIFF SDK（LINE公式。開いた人が誰かを判別するために必須）
     defer にして、SDKの読み込みを待たずに画面の枠を先に出す -->
<script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* ===== 設定色（ボディメイクプラスのロゴから取る） ===== */
  :root{
    --bg:#f4f9fd;          /* 下半身の水色を薄くしたもの */
    --card:#ffffff;
    --ink:#3a5578;         /* 体のラインの濃い青 */
    --sub:#8399b5;         /* 補助文字 */
    --line:#dce9f4;
    --accent:#ec3b78;      /* リング右下のピンク */
    --accent-weak:#fdeaf1; /* ピンクの薄い面 */
    --sky:#aedcf5;         /* 下半身の水色 */
    --head:linear-gradient(100deg,#f8a98a 0%,#ec3b78 78%);
    --danger:#b3261e;
    --radius:14px;
    /* 4フェーズ（ロゴの水色→青→オレンジ→ピンクの流れ） */
    --ph1:#7cc4e8; --ph2:#5b8fc7; --ph3:#f0996f; --ph4:#ec3b78;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:17px;              /* 本文17px以上 */
    line-height:1.6;
    padding-bottom:150px;         /* 下部固定エリア分の余白 */
    -webkit-text-size-adjust:100%;
  }
  .num{font-variant-numeric:tabular-nums;}   /* 数字の桁を揃える */

  /* ===== ヘッダ ===== */
  header{
    position:sticky;top:0;z-index:5;
    background:var(--head);color:#fff;
    padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    font-size:18px;font-weight:700;letter-spacing:.02em;
  }
  header .hello{font-size:14px;font-weight:400;opacity:.9;margin-top:2px;}

  main{padding:16px;max-width:640px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{margin:0 0 12px;font-size:17px;}
  .muted{color:var(--sub);}
  .empty{color:var(--sub);text-align:center;padding:28px 8px;}

  /* ===== 入力行 ===== */
  .field{margin-bottom:16px;}
  .field > label{display:block;font-size:16px;margin-bottom:6px;font-weight:600;}
  .field .unit{color:var(--sub);font-size:15px;margin-left:6px;font-weight:400;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;font-size:17px;color:var(--ink);background:#fbfdfb;
    border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:52px;
  }
  textarea{min-height:88px;resize:vertical;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}

  /* 大きな選択ボタン（体調・運動・活動レベルなど） */
  .choices{display:flex;gap:8px;flex-wrap:wrap;}
  .choice{
    flex:1 1 auto;min-width:52px;min-height:52px;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line);border-radius:12px;background:#fbfdfb;
    font-size:17px;font-weight:600;cursor:pointer;user-select:none;padding:8px 10px;
  }
  .choice.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* 縦並びの選択（体調のように言葉が長いもの） */
  .choices.vert{flex-direction:column;}
  .choices.vert .choice{width:100%;justify-content:flex-start;gap:10px;padding:12px 14px;}
  .choices.vert .choice .n{min-width:26px;font-size:15px;color:var(--sub);}
  .choices.vert .choice.on .n{color:#fff;}
  /* 入力欄の下に出す小さな注意書き */
  .note{font-size:14px;color:var(--sub);line-height:1.5;margin-top:6px;}

  /* 計算結果の表示ボックス */
  .calc{background:var(--accent-weak);border-radius:12px;padding:12px 14px;margin-top:6px;}
  .calc .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #cfe0d6;}
  .calc .row:last-child{border-bottom:none;}
  .calc .big{font-size:20px;font-weight:700;color:var(--accent);}

  /* ===== 姿勢写真グリッド ===== */
  .progress{font-size:22px;font-weight:700;text-align:center;margin:6px 0 14px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  /* ポーズ1つ＝1ブロック。右と左を横に2つ並べる（原本のシートと同じ並び） */
  .pose-row{margin-bottom:16px;}
  .pose-head{margin-bottom:6px;}
  .pose-name{font-size:16px;font-weight:700;}
  .pose-name .pno{color:var(--sub);font-weight:600;font-size:14px;margin-right:6px;}
  .pose-tip{display:block;font-size:14px;color:var(--sub);line-height:1.5;margin-top:2px;}
  .pair{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .pair.single{grid-template-columns:1fr;}
  .slot .dir{font-size:15px;font-weight:700;color:var(--ink);}
  /* お手本写真。画像が置かれていないときは onerror で消える */
  .sample{display:block;width:100%;max-width:320px;margin:0 auto 8px;border-radius:10px;border:1px solid var(--line);}
  .slot{
    position:relative;aspect-ratio:3/4;border:1.5px solid var(--line);border-radius:12px;
    background:#f4f8f5;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:4px;
  }
  .slot .no{position:absolute;top:4px;left:6px;font-size:13px;font-weight:700;color:var(--sub);}
  .slot .cap{font-size:12px;color:var(--sub);line-height:1.3;}
  .slot img{width:100%;height:100%;object-fit:cover;}
  .slot.done{border-color:var(--accent);}
  .slot .check{position:absolute;top:4px;right:6px;width:22px;height:22px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;}

  /* ===== 表（推移） ===== */
  table{width:100%;border-collapse:collapse;font-size:16px;}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;}
  th:first-child,td:first-child{text-align:left;}
  thead th{color:var(--sub);font-weight:600;font-size:14px;}

  /* ===== 下部固定：保存ボタン＋タブ ===== */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:6;}
  .savebar{padding:10px 16px;background:linear-gradient(to top,var(--bg),rgba(238,242,238,.0));}
  .btn-save{
    width:100%;max-width:608px;margin:0 auto;display:block;
    background:var(--accent);color:#fff;border:none;border-radius:14px;
    font-size:19px;font-weight:700;min-height:56px;cursor:pointer;box-shadow:0 4px 14px rgba(31,107,77,.25);
  }
  .btn-save:disabled{opacity:.5;}
  .btn-sub{
    width:100%;margin-top:10px;background:#fff;color:var(--accent);border:1.5px solid var(--accent);
    border-radius:14px;font-size:17px;font-weight:700;min-height:52px;cursor:pointer;
  }
  .tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font-size:12px;color:var(--sub);cursor:pointer;background:none;border:none;}
  .tab .ico{font-size:22px;line-height:1;}
  .tab.on{color:var(--accent);font-weight:700;}

  /* ===== トースト ===== */
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:16px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== 全画面ローディング ===== */
  .loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;z-index:20;}
  .spinner{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}

  /* ヘッダー右の設定ボタン（カルテはここから開く） */
  header{position:relative;}
  .gear{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    background:rgba(255,255,255,.18);border:none;color:#fff;font-size:20px;
    width:44px;height:44px;border-radius:12px;cursor:pointer;}
  /* ===== 朝と夜の切り替え ===== */
  .partsw{display:flex;gap:6px;margin-bottom:12px;}
  .partsw button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);
                 background:#fff;color:var(--sub);font-size:15px;font-weight:700;cursor:pointer;}
  .partsw button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tip{background:var(--accent-weak);border-radius:10px;padding:10px 12px;margin-bottom:14px;
       font-size:14px;line-height:1.6;}

  /* ===== 宿題（リフォームEX） ===== */
  .hw-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .hw-set{font-weight:700;font-size:18px;}
  .hw-given{color:var(--sub);font-size:14px;}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:14px;margin-bottom:14px;}
  .ex-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .ex-id{font-size:13px;font-weight:700;color:#fff;background:var(--sub);
         border-radius:20px;padding:3px 10px;letter-spacing:.03em;}
  .ex-id.p1{background:var(--ph1);} .ex-id.p2{background:var(--ph2);}
  .ex-id.p3{background:var(--ph3);} .ex-id.p4{background:var(--ph4);}
  .ex-body{font-size:14px;color:var(--sub);}
  .ex-reps{margin-left:auto;font-size:15px;font-weight:700;}
  /* 写真は原本と同じく横1列。左から右の順に番号を振る */
  .shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .shot{position:relative;flex:0 0 auto;width:132px;}
  .shot img{width:132px;height:132px;object-fit:cover;border-radius:10px;
            border:1px solid var(--line);background:#fff;display:block;}
  .shot .n{position:absolute;left:6px;top:6px;min-width:22px;height:22px;border-radius:11px;
           background:rgba(58,85,120,.86);color:#fff;font-size:13px;font-weight:700;
           display:flex;align-items:center;justify-content:center;padding:0 6px;}
  .ex-how{margin-top:10px;font-size:16px;line-height:1.65;white-space:pre-wrap;}
  .exv{width:100%;max-height:60vh;border-radius:12px;background:#000;display:block;}
  .ex-tips{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.6;
           background:var(--accent-weak);color:var(--ink);white-space:pre-wrap;}
  .ex-tips b{color:var(--accent);}
  /* カンペの画面は横に広く使う */
  body.wide main{max-width:1400px;}

  /* 宿題を組む画面。パソコンではメニューを横に並べる（縦長だと見にくい） */
  #selList{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;
           padding:2px 2px 10px;}
  /* 幅は画面に合わせて伸び縮みする。4つでも右端が切れない。
     5つ以上になったら横スクロールにする */
  #selList > .mblock{flex:1 1 0;min-width:252px;max-width:460px;}
  .mgrip{flex:0 0 auto;width:30px;height:30px;padding:0;font-size:16px;line-height:1;
         cursor:grab;touch-action:none;}
  .mblock.dragging{opacity:.6;pointer-events:none;}
  .mblock.droptarget{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;}
  .dragghost{position:fixed;z-index:50;transform:translate(-50%,-140%);pointer-events:none;
             background:var(--accent);color:#fff;font-size:13px;font-weight:700;
             padding:5px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .findrow{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px;}
  .howtap{cursor:text;}
  .howtap:hover{background:var(--accent-weak);border-radius:6px;}
  .howbox{margin:4px 0 0 34px;}
  .howbox:empty{display:none;}
  .howta{width:100%;font-size:14px;line-height:1.6;padding:8px;border:1px solid var(--accent);
         border-radius:8px;box-sizing:border-box;}
  .howrp{flex:1;min-width:90px;padding:6px 8px;font-size:14px;}
  .findrow .exshots{margin-left:34px;}
  .mblock.dragging .mhead{background:var(--accent-weak);border-radius:8px;}
  .mbox{min-height:54px;}
  /* 種目の写真。1枚だと動きが分からないので、ある分だけ小さく並べる */
  .exshots{display:flex;gap:3px;margin:4px 0 0 34px;flex-wrap:wrap;}
  .exshots img{width:40px;height:40px;object-fit:cover;border-radius:6px;
               border:1px solid var(--accent);display:block;cursor:pointer;}
  /* 画面がせまいときは、今までどおり縦に積む */
  @media(max-width:860px){
    #selList{display:block;overflow-x:visible;}
    #selList > .mblock{flex:none;}
    #selList > #btnMenuAdd{min-height:0;}
  }

  /* カンペ。1行＝1種目。縦にスワイプして見る */
  .cheat{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
  .cheat-sec{padding:9px 13px;background:var(--accent-weak);font-weight:700;font-size:14px;}
  .cheat-row{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;
             border-top:1px solid var(--line);font-size:14px;line-height:1.55;}
  .c-no{flex:0 0 22px;text-align:right;color:var(--sub);font-weight:700;font-size:13px;padding-top:3px;}
  .c-ph{flex:0 0 220px;display:flex;gap:5px;}   /* 写真が1枚でも列は揃える */
  .c-ph img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;}
  .c-ph .noimg{width:70px;height:70px;border-radius:8px;border:1px dashed var(--line);}
  .c-id{flex:0 0 76px;padding-top:2px;}
  .c-id b{display:block;font-size:14px;}
  .c-id span{font-size:11px;color:var(--sub);}
  .c-how{flex:1 1 230px;min-width:150px;white-space:pre-wrap;}
  .c-rep{flex:0 0 92px;text-align:right;font-weight:700;padding-top:2px;}
  .c-tx{flex:1 1 250px;min-width:160px;}
  .c-tips{padding:6px 9px;border-radius:7px;background:var(--accent-weak);white-space:pre-wrap;}
  .c-note{padding:6px 9px;border-radius:7px;background:#fff8dc;border:1px solid #e8d08a;
          color:#5c4a00;white-space:pre-wrap;margin-top:5px;}
  .c-none{color:var(--sub);opacity:.6;font-size:13px;}
  /* 画面がせまいときは、やり方とメモを下の段へ回す */
  @media(max-width:760px){
    .cheat-row{flex-wrap:wrap;}
    .c-how{flex:1 1 100%;order:5;}
    .c-tx{flex:1 1 100%;order:6;}
  }

  /* 指導中のカンペ。まっすーが見ているときだけ出る */
  .ex-note{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.65;
           background:#fff8dc;border:1px solid #e8d08a;color:#5c4a00;white-space:pre-wrap;}
  .ex-note::before{content:'コーチ用メモ（受講生には出ません）';display:block;
                   font-size:11px;font-weight:700;opacity:.7;margin-bottom:4px;letter-spacing:.02em;}
  /* 今日のメニューの切り替え（メニューが2つ以上ある人だけ出る） */
  .mnav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  /* 前に書いた宣言 */
  .yplan{border:1px solid #cfe3d4;background:#f3faf5;border-radius:10px;padding:10px 12px;margin:0 0 12px;}
  .yplan-h{font-size:12px;color:#5b7a63;margin-bottom:4px;}
  .yplan-b{font-size:15px;line-height:1.6;white-space:pre-wrap;}
  /* 書いたことの読み返し */
  .logday{border-top:1px solid #eee;padding:10px 0;}
  .logday:first-of-type{border-top:0;}
  .logdate{font-size:13px;font-weight:600;color:#666;margin-bottom:4px;}
  .logrow{display:flex;gap:8px;margin:2px 0;}
  .logk{flex:0 0 72px;font-size:12px;color:#888;padding-top:2px;}
  .logv{flex:1;font-size:14px;line-height:1.6;white-space:pre-wrap;}
  .logsub{font-size:12px;color:#999;margin-top:4px;}
  .mn{flex:0 0 auto;min-width:42px;height:38px;padding:0 10px;border:1px solid var(--line);
      background:#fff;border-radius:10px;font-size:15px;font-weight:700;color:var(--sub);cursor:pointer;}
  .mn.td{border-color:var(--accent);border-width:2px;}
  .mn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* できたは1種目に1つ */
  .days{display:flex;gap:6px;margin-top:12px;}
  .days.one .day{padding:11px 0 10px;}
  .days.one .day .d{font-size:14px;}
  .day{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;
       padding:7px 0 6px;text-align:center;cursor:pointer;font-size:12px;color:var(--sub);
       line-height:1.25;}
  .day .d{font-size:11px;}
  .day .m{font-size:18px;line-height:1.1;height:20px;}
  .day.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .day.today{border-color:var(--accent);border-width:2px;}
  /* まっすー用 */
  .pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .pick select,.pick input{flex:1;min-width:120px;}
  .stu{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .stu .nm{font-weight:700;}
  .stu .mt{margin-left:auto;font-size:13px;color:var(--sub);text-align:right;}
  .row-ex{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .row-ex img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .row-ex .tx{flex:1;min-width:0;font-size:14px;line-height:1.45;
              display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .row-ex button{flex:0 0 auto;}
  .mini{font-size:14px;padding:7px 12px;border-radius:9px;border:1px solid var(--accent);
        background:#fff;color:var(--accent);font-weight:700;cursor:pointer;}
  .mini.fill{background:var(--accent);color:#fff;}

  /* 並べかえは、つまみを押したまま動かす */
  .grip{flex:0 0 auto;width:34px;height:40px;padding:0;font-size:17px;line-height:1;
        border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:7px;
        cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;}
  .exrow.dragging{opacity:.55;pointer-events:none;}
  .exrow.dragging .row-ex{background:var(--accent-weak);border-radius:8px;}
  /* メニューのかたまり（A・B・C・D） */
  .mblock{border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;margin-bottom:14px;}
  .mblock.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .mhead .mt{font-weight:700;font-size:15px;flex:0 0 auto;}
  .mhead .mname{flex:1;min-width:110px;padding:6px 8px;font-size:14px;}
  .mhead .mc{font-size:13px;color:var(--sub);flex:0 0 auto;}
  .mbox{min-height:8px;}
  /* 並べかえ用の上下ボタン（いまは使っていない） */
  .ord{display:flex;flex-direction:column;gap:3px;flex:0 0 auto;}
  .ord button{width:34px;height:25px;padding:0;font-size:13px;line-height:1;border-radius:7px;
              border:1px solid var(--line);background:#fff;color:var(--sub);font-weight:700;cursor:pointer;}
  .ord button:disabled{opacity:.3;}

                  color:var(--accent);font-weight:700;margin-right:6px;white-space:nowrap;}

  /* 写真の入れかえパネル */

<body>

<!-- 起動中ローディング -->

</div>

<header>
  痩せ体質完成ノート
  <div class="hello" id="hello"></div>
  <button class="gear" id="btnKarte" title="カルテ">⚙</button>
  <button class="gear hidden" id="btnCoach" title="まっすー用" style="right:52px;">👥</button>
</header>

<main>
  <!-- 画面1：今日の記録 -->
  <section id="view-record" class="view"></section>
  <!-- 画面2：姿勢写真 -->

<!-- 下部固定：保存ボタン（画面ごとに出し分け）＋タブ -->
<div class="dock">

  <nav class="tabs">
    <button class="tab on" data-view="record"><span class="ico">✏️</span>今日の記録</button>
    <button class="tab" data-view="homework"><span class="ico">🏋️</span>宿題</button>
    <button class="tab" data-view="photo"><span class="ico">📷</span>姿勢写真</button>
    <button class="tab" data-view="trend"><span class="ico">📈</span>推移</button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<!-- 写真選択用の隠しinput -->
<input type="file" id="filePick" accept="image/*" class="hidden">
<input type="file" id="fileMulti" accept="image/*" multiple class="hidden">
<input type="file" id="fileEx" accept="image/*" multiple class="hidden">
<input type="file" id="fileAdd" accept="image/*" multiple class="hidden">

<script>
/* ================= 設定（増田さんが貼り替える2つ） ================= */
var CONFIG = {
  LIFF_ID: '2011268566-JqNKAkur',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbz-YyCsJ2su_IviYAWogU92SrxAZ4Vne52mYFtQ29zp8f8dm3m8V3JJW5q7rDq8pXsr/exec'
};

/* ================= 共通状態 ================= */
var S = { idToken:null, name:'', today:'', shootDates:[], round:1, karte:null };

/* ================= サーバー通信 ================= */
function api(action, payload){
  var body = Object.assign({ action:action, idToken:S.idToken }, payload || {});
  /* 返ってこないまま待ち続けると、ぐるぐるが止まらない。25秒で打ち切る */
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  var killer = setTimeout(function(){ if(ctl) ctl.abort(); }, 25000);
  var opt = {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},  // プリフライトを避ける
    body: JSON.stringify(body)
  };
  if(ctl) opt.signal = ctl.signal;
  return fetch(CONFIG.GAS_URL, opt).then(function(r){
    clearTimeout(killer);
    return r.json();
  }, function(e){
    clearTimeout(killer);
    throw new Error('つながりませんでした');
  }).then(function(res){
    if(res && res.ms) S.lastMs = res.ms;          /* どこで待ったかの内訳 */
    if(!res.ok) throw new Error(res.error || 'server error');
    return res.data;
  });
}

/* ================= 画面ユーティリティ ================= */
function $(id){ return document.getElementById(id); }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },1800);
}
/* 最後に見ていた画面を覚えておく。開き直したとき同じところへ戻るため */
function rememberView(name, lineId){
  try{
    localStorage.setItem('bm_view', JSON.stringify({
      v: name, s: lineId || (S.target && S.target.lineId) || '', t: Date.now()
    }));
  }catch(e){}
}
function lastView(){
  try{
    var o = JSON.parse(localStorage.getItem('bm_view') || 'null');
    if(!o || !o.v) return null;
    if(Date.now() - (o.t||0) > 12*3600*1000) return null;   /* 12時間で忘れる */
    return o;
  }catch(e){ return null; }
}
function showView(name){
  S.view = name;
  ['record','photo','karte','trend','homework','coach'].forEach(function(v){
    $('view-'+v).classList.toggle('hidden', v!==name);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.classList.toggle('on', b.dataset.view===name);
  });
  $('savebar').innerHTML='';
  if(name==='record') renderRecordSave();
  if(name==='karte') renderKarteSave();
  if(name==='photo') renderPhotoSave();
  window.scrollTo(0,0);
}

/* ================= 起動 ================= */
/* 前回開いたときの内容を端末に覚えておき、次に開いたときはそれを先に出す。
 * サーバーから最新が届いたら、あとから静かに差し替える。
 * 立ち上がりは GAS の準備とシートを開く時間で数秒かかるので、
 * 「待たせない」はここで作る */
var BOOT_KEY = 'bm_boot_v1';
/* 手元に残した控えの形を変えたときは、古いものを捨てる。
   中途半端な控えが残っていると、開いたときに止まってしまうため */
(function cleanOldCache(){
  try{
    if(localStorage.getItem('bm_cache_ver') !== '3'){
      var keep = {};
      localStorage.clear();
      localStorage.setItem('bm_cache_ver', '3');
    }
  }catch(e){}
})();

function bootCacheRead(){
  try{
    var s = localStorage.getItem(BOOT_KEY);
    if(!s) return null;
    var c = JSON.parse(s);
    return (c && c.name !== undefined) ? c : null;
  }catch(e){ return null; }
}
function bootCacheWrite(d){
  try{
    localStorage.setItem(BOOT_KEY, JSON.stringify({
      name:d.name, isCoach:!!d.isCoach, today:d.today, hasKarte:!!d.hasKarte,
      shootDates:d.shootDates||[], todayDiary:d.todayDiary||null, homework:d.homework||null
    }));
  }catch(e){}
}
/* 端末側の今日。キャッシュが前日のものかを見分けるため */
function todayLocal(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}

function applyBoot(d){
  S.name=d.name||''; S.shootDates=d.shootDates||[]; S.isCoach=!!d.isCoach;
  S.today=d.today||todayLocal();
  S.hw=d.homework||null;
  S.yesterdayPlan=d.yesterdayPlan||null;   /* 前に書いた「明日やること」 */
  if(S.isCoach) $('btnCoach').classList.remove('hidden');
  S.bootDone = true;
  $('hello').textContent = S.name ? (S.name+' さん') : 'ようこそ';
  /* 打ちはじめていたら書き換えない。数字を消してしまわないため */
  if(!S.dirty) renderRecord(d.todayDiary);
  $('loading').classList.add('hidden');
  if(!S.tabsReady){
    S.tabsReady=true;
    setupTabs();
    var lv = lastView();
    /* 本人確認が終わってからでないと通信できないので、コーチ画面は少し待って開く */
    if(lv && lv.v==='coach' && S.isCoach && S.idToken){
      if(lv.s) S.wantStudent = lv.s;        /* 受講生の画面まで戻す */
      showView('coach');
      loadCoach();
    }else if(lv && ['record','homework','photo','trend','karte'].indexOf(lv.v)>=0){
      if(lv.v==='photo') loadPhotos(S.round);
      if(lv.v==='homework') loadHomework();
      if(lv.v==='karte') loadKarte();
      if(lv.v==='trend') loadTrend();
      showView(lv.v);
    }else{
      showView('record');
    }
  }
}

function boot(){
  var t0 = Date.now();
  var c = bootCacheRead();
  if(c){
    if(c.today !== todayLocal()){ c.today = todayLocal(); c.todayDiary = null; }
    applyBoot(c);                                  /* 通信を待たずに先に出す */
  }
  if(!window.liff){
    if(!c) fail('つながりませんでした。もう一度開いてください');
    return;
  }
  liff.init({ liffId: CONFIG.LIFF_ID }).then(function(){
    if(!liff.isLoggedIn()){ liff.login(); return; }
    S.idToken = liff.getIDToken();
    return api('bootstrap', {});
  }).then(function(d){
    if(!d) return;
    bootCacheWrite(d);
    applyBoot(d);
    if(S.isCoach) showBootMs(Date.now() - t0);
  }).catch(function(e){
    if(c) toast('最新にできませんでした。前回の内容を出しています');
    else fail('読み込みに失敗しました。電波の良い場所でもう一度お試しください');
  });
}

/* まっすーの画面だけ、どこで待ったかを秒数で出す。
 * これを見てから次の手を打つ（あて推量で直さない） */
function showBootMs(total){
  var m = S.lastMs || {};
  function s(v){ return (Math.round(v)/1000).toFixed(1); }
  var parts = [];
  if(m.verify!=null)  parts.push('本人確認 '+s(m.verify));
  if(m.student!=null) parts.push('名簿 '+s(m.student));
  if(m.action!=null)  parts.push('中身 '+s(m.action));
  var line = '起動 '+s(total)+'秒（サーバー '+(m.total!=null?s(m.total):'—')+'秒'+
             (parts.length?'：'+parts.join('／'):'')+'）';
  var v = $('view-record'); if(!v) return;
  var box = document.createElement('div');
  box.className = 'muted num';
  box.style.cssText = 'text-align:center;font-size:11px;padding:2px 0 6px;';
  box.textContent = line;
  v.insertBefore(box, v.firstChild);
}
function fail(msg){
  $('loading').innerHTML='<div class="empty">'+msg+'</div>';
}
function setupTabs(){
  $('btnKarte').addEventListener('click',function(){ loadKarte(); showView('karte'); });
  $('btnCoach').addEventListener('click',function(){ loadCoach(); showView('coach'); });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.addEventListener('click',function(){
      var v=b.dataset.view;
      if(v==='photo') loadPhotos(S.round);
      if(v==='homework') loadHomework();
      if(v==='karte') loadKarte();
      if(v==='trend') loadTrend();
      showView(v);
      rememberView(v);
    });
  });
}

/* ============================================================
 * 画面1：今日の記録
 * ============================================================ */
/* 朝に書くもの／夜に書くもの。ここを直せば振り分けが変わる
   朝 … 起きてすぐ測るもの（夜に測ると数字がブレる）
   夜 … 1日が終わらないと決まらないもの */
var PART_AM = ['体重','ウエスト','右もも','左もも','歩数','体調'];
var PART_PM = ['カテ1','カテ2','カテ3','運動','その日の気づき','明日やること'];
var PART_LABEL = { am:'朝', pm:'夜', all:'ぜんぶ' };

/* いま朝の画面か夜の画面か。URLの ?t=am / ?t=pm が最優先、無ければ時刻で決める */
function currentPart(){
  if (S.part) return S.part;
  var q = (location.search.match(/[?&]t=(am|pm|all)/) || [])[1];
  if (q) return q;
  var h = new Date().getHours();
  return (h >= 4 && h < 12) ? 'am' : 'pm';
}
function inPart(key){
  var p = currentPart();
  if (p === 'all') return true;
  return (p === 'am' ? PART_AM : PART_PM).indexOf(key) >= 0;
}

var RECORD_FIELDS = [
  {key:'体重', unit:'kg', step:'0.1', mode:'decimal'},
  {key:'ウエスト', unit:'cm', step:'0.1', mode:'decimal'},
  {key:'右もも', unit:'cm', step:'0.1', mode:'decimal'},
  {key:'左もも', unit:'cm', step:'0.1', mode:'decimal'},
  {key:'歩数', unit:'歩', step:'1', mode:'numeric'}
];
/* カテ1〜3は量を数えず、3つから選ぶ。名前は栄養コンシェルジュの教材に合わせる
   （シートの列名は原本どおり カテ1/カテ2/カテ3 のまま保存する） */
var CATE_FIELDS = [
  {key:'カテ1', label:'カテゴリー1　炭水化物'},
  {key:'カテ2', label:'カテゴリー2　タンパク質'},
  {key:'カテ3', label:'カテゴリー3　野菜'}
];
var CATE_KEYS = CATE_FIELDS.map(function(f){ return f.key; });
var CATE_OPTS = ['少ない','適量','多すぎた'];
/* 体調は数字だけだと分かりにくいので言葉をつける */
var COND_OPTS = [['1','絶不調'],['2','不調'],['3','普通'],['4','好調'],['5','絶好調']];
function renderRecord(diary){
  diary = diary || {};
  S.diary = diary;
  var part = currentPart();

  var html='<div class="partsw">';
  ['am','pm','all'].forEach(function(p){
    html+='<button data-p="'+p+'"'+(p===part?' class="on"':'')+'>'+PART_LABEL[p]+'</button>';
  });
  html+='</div>';

  html+='<div class="card"><h2>今日の記録　<span class="muted num">'+S.today+'</span></h2>';
  if(part==='am'){
    html+='<div class="tip">体重とサイズは、起きてトイレを済ませたあと、朝ごはんの前に測りましょう。'+
          '夜に測ると水分や食事の分で数字がブレます</div>';
  }
  if(part==='pm'){
    html+='<div class="tip">1日おつかれさまでした。今日できたことを、ひとつでも書き残しておきましょう</div>';
    /* 前に書いた宣言を先に見せる。自分が何を決めたか思い出してから書いてもらう */
    var yp = S.yesterdayPlan;
    if(yp && yp.plan){
      html+='<div class="yplan"><div class="yplan-h">'+esc(mmdd(yp.date))+'に決めたこと</div>'+
            '<div class="yplan-b">'+esc(yp.plan)+'</div></div>';
    }
  }

  RECORD_FIELDS.forEach(function(f){
    if(!inPart(f.key)) return;
    var v = diary[f.key]!=null ? diary[f.key] : '';
    html+='<div class="field"><label>'+f.key+'<span class="unit">'+f.unit+'</span></label>'+
      '<input type="number" inputmode="'+f.mode+'" step="'+f.step+'" id="rec_'+f.key+'" class="num" value="'+esc(v)+'"></div>';
  });
  // カテ1〜3（少ない／適量／多すぎた）
  CATE_FIELDS.forEach(function(f){
    if(!inPart(f.key)) return;
    html+='<div class="field"><label>'+f.label+'</label><div class="choices" id="rec_'+f.key+'">';
    CATE_OPTS.forEach(function(o){ html+='<div class="choice" data-val="'+o+'">'+o+'</div>'; });
    html+='</div></div>';
  });
  // 体調（言葉つきの5段階。縦に並べて読みやすく）
  if(inPart('体調')){
    html+='<div class="field"><label>体調</label><div class="choices vert" id="rec_体調">';
    COND_OPTS.forEach(function(o){
      html+='<div class="choice" data-val="'+o[0]+'"><span class="n">'+o[0]+'</span>'+o[1]+'</div>';
    });
    html+='</div></div>';
  }
  // 運動
  if(inPart('運動')){
    html+='<div class="field"><label>運動</label><div class="choices" id="rec_運動">'+
      '<div class="choice" data-val="した">した</div><div class="choice" data-val="していない">していない</div></div>'+
      '<div class="note">完全にゼロの日は作らないようにしましょう。1分のストレッチでも「した」でOKです</div></div>';
  }
  // 今日できたこと（LINEの振り返りフォームと同じ問い）
  if(inPart('その日の気づき')){
    html+='<div class="field"><label>今日できたこと、意識したこと</label>'+
      '<textarea id="rec_気づき" placeholder="ひとことでもOKです">'+esc(diary['その日の気づき']||'')+'</textarea></div>';
  }
  // 明日やること
  if(inPart('明日やること')){
    html+='<div class="field"><label>明日はどんなことにチャレンジしますか</label>'+
      '<textarea id="rec_明日" placeholder="小さなことで大丈夫です">'+esc(diary['明日やること']||'')+'</textarea></div>';
  }
  html+='</div>';
  $('view-record').innerHTML=html;

  CATE_KEYS.forEach(function(k){ if(inPart(k)) bindChoices('rec_'+k, diary[k]); });
  if(inPart('体調')) bindChoices('rec_体調', diary['体調']);
  if(inPart('運動')) bindChoices('rec_運動', diary['運動']);

  Array.prototype.forEach.call(document.querySelectorAll('.partsw button'),function(b){
    b.addEventListener('click',function(){
      S.part = b.dataset.p;
      renderRecord(S.diary);
      renderRecordSave();
    });
  });

  /* 何か1つでも入力したら、あとから届いた最新で描き換えない。
     中身は毎回入れ替わるので、見張りは外の箱に1回だけ付ける */
  if(!S.dirtyHooked){
    S.dirtyHooked = true;
    var box = $('view-record');
    box.addEventListener('input', function(){ S.dirty = true; });
    box.addEventListener('click', function(ev){
      var t = ev.target;
      while(t && t !== box){
        if(t.classList && t.classList.contains('choice')){ S.dirty = true; return; }
        t = t.parentNode;
      }
    });
  }
}
function bindChoices(groupId, current){
  var g=$(groupId); if(!g) return;
  Array.prototype.forEach.call(g.children,function(c){
    if(String(c.dataset.val)===String(current)) c.classList.add('on');
    c.addEventListener('click',function(){
      Array.prototype.forEach.call(g.children,function(x){x.classList.remove('on');});
      c.classList.add('on');
    });
  });
}
function renderRecordSave(){
  $('savebar').innerHTML='<button class="btn-save" id="btnSaveRecord">保存する</button>';
  $('btnSaveRecord').addEventListener('click', saveRecord);
}
function saveRecord(){
  var btn=$('btnSaveRecord'); btn.disabled=true; btn.textContent='保存中…';
  var data={ date:S.today };
  RECORD_FIELDS.forEach(function(f){ if($('rec_'+f.key)) data[f.key]=$('rec_'+f.key).value; });
  CATE_KEYS.forEach(function(k){ if($('rec_'+k)) data[k]=selected('rec_'+k); });
  if($('rec_体調')) data['体調']=selected('rec_体調');
  if($('rec_運動')) data['運動']=selected('rec_運動');
  if($('rec_気づき')) data['その日の気づき']=$('rec_気づき').value;
  if($('rec_明日')) data['明日やること']=$('rec_明日').value;
  S.dirty = false;                       /* 保存できたら、また最新で描き換えてよい */
  api('saveDaily',{data:data}).then(function(){
    toast('保存しました'); btn.disabled=false; btn.textContent='保存する';
  }).catch(function(){
    alert2('保存できませんでした。もう一度お試しください'); btn.disabled=false; btn.textContent='保存する';
  });
}
function selected(groupId){
  var on=$(groupId).querySelector('.choice.on'); return on?on.dataset.val:'';
}

/* ============================================================
 * 画面3：カルテ
 * ============================================================ */
var KARTE_META = null;  // サーバーから受け取る fields
function loadKarte(){
  api('getKarte',{}).then(function(d){
    S.karte=d; KARTE_META=d.fields; renderKarte(d);
  }).catch(function(){ $('view-karte').innerHTML='<div class="card"><div class="empty">読み込めませんでした</div></div>'; });
}
function renderKarte(d){
  var v=d.values||{};
  var html='<div class="card"><h2>カルテ（プロフィール）</h2>';
  d.fields.forEach(function(f){
    var val=v[f.key]!=null?v[f.key]:'';
    if(f.type==='sex'){
      html+=fieldWrap(f.label, choicesHtml('k_'+f.key, ['男性','女性'], val));
    }else if(f.type==='act'){
      html+=fieldWrap(f.label,
        choicesHtml('k_'+f.key, ACT_OPTS, val, true)+
        '<div class="note">デスクワークの方は、仕事以外でどれくらい歩くかで選んでください。'+
        '迷ったら2を選んでOKです。あとから変えられます</div>');
    }else if(f.type==='date'){
      html+='<div class="field"><label>'+f.label+'</label><input type="date" id="k_'+f.key+'" value="'+esc(val)+'"></div>';
    }else if(f.type==='num'){
      html+='<div class="field"><label>'+f.label+'</label><input type="number" inputmode="decimal" id="k_'+f.key+'" class="num" value="'+esc(val)+'"></div>';
    }else{

/* 端末側で長辺1600px・JPEG0.8に縮小し base64 を返す（必須処理） */
function shrink(file){
  return new Promise(function(resolve,reject){
    var img=new Image();
    var reader=new FileReader();
    reader.onload=function(){ img.src=reader.result; };
    reader.onerror=reject;
    img.onload=function(){
      var max=1600, w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var dataUrl=canvas.toDataURL('image/jpeg',0.8);
      resolve({ dataUrl:dataUrl, base64:dataUrl.split(',')[1] });
    };
    img.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function uploadSlot(no, b64, el, quiet){
  if(el){ el.classList.add('uploading'); }
  return api('uploadPhoto',{ round:PHOTO_STATE.round, no:no, imageBase64:b64.base64 }).then(function(){
    // その場でサムネイル表示（端末が持っている画像を使う。ドライブは非公開のまま）
    if(el){
      el.classList.add('done');
      el.innerHTML='<span class="no">'+no+'</span><span class="check">✓</span>'+
        '<img src="'+b64.dataUrl+'" alt="">';
      el.onclick=function(){ pickOne(no, el); };
    }
    var slot=PHOTO_STATE.slots.filter(function(s){return s.no===no;})[0];
    if(slot) slot.filled=true;
    updateProgress();
    if(!quiet) toast('アップロードしました');
  }).catch(function(){
    if(el) el.classList.remove('uploading');
    alert2('電波の良い場所でもう一度お試しください');
  });
}

}

function vUrl(v){

/* 写真を、画面に出す大きさに合わせて取りにいく。
 * マスターには sz=w600 で入っているが、宿題のコマは132px、一覧は52px。
 * 大きいまま読むと待ち時間がのびるので、ここで小さい方を頼む（マスターは書き換えない） */
function thumb(u, w){
  u = String(u||'');
  return /drive\.google\.com/.test(u) ? u.replace(/([?&]sz=)w\d+/, '$1w'+w) : u;
}

function exCard(x, today, done){
  var p=PH_NO[x.phase]||0;

  h+='<div class="ex-top"><span class="ex-id'+(p?' p'+p:'')+'">'+esc(x.id)+'</span>';

     (x.sub&&x.sub.length?' <span style="opacity:.75">+'+esc(x.sub.join('・'))+'</span>':'')+'</span>';
  /* 回数とセット数。1セットは書く意味がないので出さない。
   * 「1分」「10深呼吸」のような文字でも、そのまま出る */
  var r=[]; if(x.reps) r.push(x.reps);
  var st=String(x.sets||'').trim();
  if(st && st!=='1' && st!=='1セット') r.push(st);
  if(r.length) h+='<span class="ex-reps">'+esc(r.join(' × '))+'</span>';
  h+='</div>';
  if(x.video){
    h+='<video class="exv" src="'+esc(vUrl(x.video))+'" controls playsinline preload="none"'+
       ((x.photos&&x.photos.length)?' poster="'+esc(thumb(x.photos[0],600))+'"':'')+'></video>';
  } else if(x.photos && x.photos.length){
    h+='<div class="shots">';
    x.photos.forEach(function(u,i){
      h+='<div class="shot"><img src="'+esc(thumb(u,300))+'" loading="lazy" decoding="async" alt="">'+
         '<span class="n">'+(i+1)+'</span>'+
         (S.isCoach?'<button class="x" data-hwph="'+esc(x.id)+'" data-i="'+i+'">×</button>':'')+
         '</div>';

  if(x.tips) h+='<div class="ex-tips">'+esc(x.tips)+'</div>';
  /* カンペ。サーバーが まっすー にしか送らないので、ここに来る時点で本人の画面 */
  if(x.note) h+='<div class="ex-note">'+esc(x.note)+'</div>';

     '<div class="d">'+(on?'できました':'できたら押す')+'</div>'+
     '<div class="m">'+(on?'✓':'')+'</div></button>';
  h+='</div></div>';
  return h;
}

/* 手元のデータにも「できた」を映しておく。画面を描き直しても消えないように */
function markDone(d, date, exId, on){
  d.done = d.done || {};
  d.done[date] = d.done[date] || {};
  if(on) d.done[date][exId]=true; else delete d.done[date][exId];

function bindDays(d, list, today){
  function paint(b, on){
    b.classList.toggle('on',on);
    b.querySelector('.d').textContent = on?'できました':'できたら押す';
    b.querySelector('.m').textContent = on?'✓':'';
  }
  Array.prototype.forEach.call(document.querySelectorAll('#view-homework .day'),function(b){
    b.addEventListener('click',function(){
      var on=!b.classList.contains('on');
      paint(b,on);
      markDone(d, b.dataset.date, b.dataset.ex, on);
      api('saveDone',{ data:{ date:b.dataset.date, exId:b.dataset.ex, done:on } })
        .then(function(){ if(on) toast('できた！ その調子です'); })
        .catch(function(){
          paint(b,!on);
          markDone(d, b.dataset.date, b.dataset.ex, !on);
          toast('保存できませんでした');
        });
    });
  });
  /* メニューの切り替え。今日のばん以外も見られる */
  Array.prototype.forEach.call(document.querySelectorAll('#view-homework [data-mno]'),function(b){
    b.addEventListener('click',function(){
      S.hwNo=Number(b.dataset.mno);
      renderHomework(d);
      window.scrollTo(0,0);
    });
  });
  /* のこりをまとめて押す */
  var ab=$('btnAllDone');
  if(ab) ab.addEventListener('click',function(){
    var dt=(d.done&&d.done[today])||{};
    var rest=(list||[]).filter(function(x){ return !dt[x.id]; }).map(function(x){ return x.id; });
    if(!rest.length) return;
    ab.disabled=true; ab.textContent='記録しています…';
    api('saveDoneMany',{data:{date:today, exIds:rest, done:true}}).then(function(){
      rest.forEach(function(id){ markDone(d, today, id, true); });
      toast('おつかれさまでした！ 今日のぶん、記録しました');
      renderHomework(d);
    }).catch(function(){
      ab.disabled=false; ab.textContent='のこりも、できた';
      toast('記録できませんでした');
    });
  });
  /* まっすーが自分の画面で見ているときだけ、写真を消すボタンが出る */
  Array.prototype.forEach.call(document.querySelectorAll('#view-homework [data-hwph]'),function(b){
    b.addEventListener('click',function(){
      var id=b.dataset.hwph, i=Number(b.dataset.i);
      if(!confirm(id+' の '+(i+1)+'枚目を消します。元に戻せません。よろしいですか？')) return;
      b.disabled=true;
      api('coachDelPhoto',{data:{exId:id, index:i}}).then(function(r){
        (S.hw.items||[]).forEach(function(x){ if(x.id===id && x.photos) x.photos.splice(i,1); });
        hwCacheWrite(S.hw);
        toast('消しました。のこり '+r.left+'枚');
        renderHomework(S.hw);
      }).catch(function(e){ b.disabled=false; toast('消せませんでした：'+String(e.message||e)); });
    });
  });
}

  try{ return JSON.parse(localStorage.getItem('bm_coach')||'null'); }catch(e){ return null; }
}

/* 本人が開く前に名簿へ入れる。
 * LINE ID はエルメの友だち一覧にあるものをそのまま貼る */
function inviteStudent(){
  var nm = $('invName').value.trim();
  var id = $('invId').value.trim();
  if(!nm){ toast('お名前を入れてください'); return; }
  if(!/^U[0-9a-f]{32}$/.test(id)){ toast('LINE IDの形がちがいます（Uではじまる33文字）'); return; }
  var b = $('btnInvite'); b.disabled = true; b.textContent = '登録しています…';
  api('coachInvite',{data:{lineId:id, name:nm}}).then(function(r){
    toast(r.already ? (r.name+' さんはもう名簿にいます') : (r.name+' さんを登録しました'));
    loadCoach();
  }).catch(function(e){
    toast(String(e.message||'登録できませんでした'));
    b.disabled = false; b.textContent = '名簿に登録する';
  });
}

function stuCacheRead(id){
  try{ return JSON.parse(localStorage.getItem('bm_stu_'+id)||'null'); }catch(e){ return null; }
}
function stuCacheWrite(id, d){
  try{ localStorage.setItem('bm_stu_'+id, JSON.stringify(d)); }catch(e){}
}
function applyStudent(d){
  S.target=d; S.selInfo={};
  d.items.forEach(function(x){ S.selInfo[x.id]=x; });
  S.menus = (d.menus && d.menus.length)
    ? d.menus.map(function(m){ return { name:m.name||'', ids:(m.ids||[]).slice() }; })
    : [{ name:'', ids:[] }];
  if(S.cur==null || S.cur>=S.menus.length) S.cur = 0;
  S.reps = d.reps || {};
  renderAssign();
  rememberView('coach', d.lineId);
}
function openStudent(lineId){
  $('view-coach').innerHTML='<div class="empty">読み込んでいます…</div>';
  S.cur = 0;
  api('coachOpen',{data:{lineId:lineId}}).then(function(d){
    applyStudent(d);
  }).catch(function(){ toast('開けませんでした'); renderCoachHome(); });
}
function openStudentOld(lineId){
  $('view-coach').innerHTML='<div class="empty">読み込んでいます…</div>';
  api('coachOpen',{data:{lineId:lineId}}).then(function(d){
    S.target=d; S.selInfo={};
    d.items.forEach(function(x){ S.selInfo[x.id]=x; });
    /* メニュー（A・B・C・D）。人によって数が変わる。1つだけの人もいる */
    S.menus = (d.menus && d.menus.length)
      ? d.menus.map(function(m){ return { name:m.name||'', ids:(m.ids||[]).slice() }; })
      : [{ name:'', ids:[] }];
    S.cur = 0;                      // 種目を足す先のメニュー
    S.reps = d.reps || {};          // この人用に決めた回数。空ならEXマスターの共通の回数が出る
    renderAssign();
  }).catch(function(){ toast('開けませんでした'); renderCoachHome(); });
}

/* いま出している種目ぜんぶ（メニューをまたいで数える） */
function selAll(){
  var out=[];
  (S.menus||[]).forEach(function(m){ (m.ids||[]).forEach(function(id){ out.push(id); }); });
  return out;
}
function selCount(){ return selAll().length; }

/* カンペ。1行＝1種目の横長。指導中はこれを別の画面に出しておく。
 * 写真・やり方・回数・コツ・コーチ用メモが1行に並ぶ */
function renderCheat(){
  var d=S.target, c=S.coach;
  var me=(c.students.filter(function(s){return s.lineId===d.lineId;})[0]||{});
  document.body.classList.add('wide');

  var h='<div class="card"><div class="hw-head">'+
        '<span class="hw-set">'+esc(me.name||'')+' さん　カンペ</span>'+
        '<span class="hw-given">'+selCount()+'種目'+
          (S.menus.length>1?'／'+S.menus.length+'メニュー':'')+'</span></div>'+
        '<button class="mini" id="btnCheatBack">← 出す内容にもどる</button></div>';

  h+='<div class="cheat">';
  var any=false;
  S.menus.forEach(function(m, mi){
    if(!m.ids.length) return;
    any=true;
    if(S.menus.length>1){
      h+='<div class="cheat-sec">メニュー '+(mi+1)+(m.name?'　'+esc(m.name):'')+'　'+m.ids.length+'種目</div>';
    }
    m.ids.forEach(function(id,i){
      var x=S.selInfo[id]||{};
      var rp=(S.reps&&S.reps[id])||{};
      var reps=rp.reps||x.baseReps||x.reps||'';
      var sets=rp.sets||x.baseSets||x.sets||'';
      var st=String(sets).trim();
      var r=[]; if(reps) r.push(reps);
      if(st && st!=='1' && st!=='1セット') r.push(st);

      h+='<div class="cheat-row">'+
         '<div class="c-no">'+(i+1)+'</div>'+
         '<div class="c-ph">'+
           ((x.photos&&x.photos.length)
             ? x.photos.slice(0,3).map(function(u){
                 return '<img src="'+esc(thumb(u,300))+'" loading="lazy" decoding="async" alt="">';
               }).join('')
             : '<div class="noimg"></div>')+
         '</div>'+
         '<div class="c-id"><b>'+esc(id)+'</b><span>'+esc(x.phase||'')+
           (x.body?'<br>'+esc(x.body):'')+'</span></div>'+
         '<div class="c-how">'+esc(x.how||'')+'</div>'+
         '<div class="c-rep">'+esc(r.join(' × '))+'</div>'+
         '<div class="c-tx">'+
           (x.tips?'<div class="c-tips">'+esc(x.tips)+'</div>':'')+
           (x.note?'<div class="c-note">'+esc(x.note)+'</div>':'')+
           ((!x.tips&&!x.note)?'<div class="c-none">メモなし</div>':'')+
         '</div>'+
         '</div>';
    });
  });
  if(!any) h+='<div class="cheat-row"><div class="c-none">まだ種目が入っていません</div></div>';
  h+='</div>';

  $('view-coach').innerHTML=h;
  $('btnCheatBack').addEventListener('click',function(){
    renderAssign();
  });
  window.scrollTo(0,0);
}

function renderSel(){
  /* 前のドラッグの名残を消す。残っていると、そのメニューが押せない */
  Array.prototype.forEach.call(document.querySelectorAll('.dragging,.droptarget'),
    function(e){ e.classList.remove('dragging'); e.classList.remove('droptarget'); });
  var gh=document.querySelector('.dragghost');
  if(gh && gh.parentNode) gh.parentNode.removeChild(gh);
  if(!S.menus || !S.menus.length) S.menus=[{ name:'', ids:[] }];
  var many = S.menus.length>1;
  var h='';
  S.menus.forEach(function(m, mi){
    h+='<div class="mblock'+(mi===S.cur?' cur':'')+'" data-mi="'+mi+'">'+
       '<div class="mhead">'+
         (many?'<button class="grip mgrip" data-mgrip="'+mi+'" '+
               'title="押したまま動かすとメニューごと並べかえ">⠿</button>':'')+
         '<span class="mt">'+(many?('メニュー '+(mi+1)):'メニュー')+'</span>'+
         '<input type="text" class="mname" data-mn="'+mi+'" value="'+esc(m.name||'')+'" '+
           'placeholder="なまえ（受講生には出ません）" autocapitalize="off" spellcheck="false">'+
         '<span class="mc">'+m.ids.length+'種目</span>'+
         (many?'<button class="mini" data-mdel="'+mi+'">このメニューを消す</button>':'')+
       '</div><div class="mbox" id="mbox-'+mi+'">';
    if(!m.ids.length) h+='<div class="empty">まだ何も入っていません</div>';
    m.ids.forEach(function(id,i){ h+=selRow(id, i, mi); });
    h+='</div>'+
       (many?'<button class="mini'+(mi===S.cur?' fill':'')+'" data-mpick="'+mi+'">'+
             (mi===S.cur?'ここに足します':'ここに足す')+'</button>':'')+
       '</div>';
  });
  $('selList').innerHTML=h;
  bindSel();
}

function selRow(id, i, mi){
  var x=S.selInfo[id]||{id:id,how:'',photos:[]};
  var rp=(S.reps&&S.reps[id])||{};
  var h='<div class="exrow" data-exid="'+esc(id)+'">'+
     '<div class="row-ex">'+
       '<button class="grip" data-grip="1" title="押したまま動かすと並べかえ">⠿</button>'+
       '<span class="no">'+(i+1)+'</span>';
  h+='<div class="tx howtap" data-how="'+esc(id)+'" title="押すと やり方の文を直せます">'+
     (x.phase?'<span class="ph-tag">'+esc(x.phase)+'</span>':'')+
     '<b>'+esc(id)+'</b>　'+esc(x.how||'')+'</div>'+
     '<button class="mini" data-del="'+esc(id)+'" data-dmi="'+mi+'">外す</button>'+
     '</div>'+
     '<div class="howbox" id="howedit-'+esc(id)+'"></div>';
  /* 写真は1枚だと動きが分からないので、ある分だけ小さく横に並べる */
  if(x.photos && x.photos.length){
    h+='<div class="exshots">';
    x.photos.slice(0,5).forEach(function(u){
      h+='<img src="'+esc(thumb(u,160))+'" loading="lazy" decoding="async" alt="" '+
         'data-photo="'+esc(id)+'">';
    });
    h+='</div>';
  }
  h+='<div class="rp-row">'+
       '<input type="text" data-rp="'+esc(id)+'" value="'+esc(rp.reps||'')+'" '+
         'placeholder="'+esc(x.baseReps||'回数')+'" autocapitalize="off" spellcheck="false">'+
       '<span class="rp-x">×</span>'+
       '<input type="text" class="rp-s" data-rs="'+esc(id)+'" value="'+esc(rp.sets||'')+'" '+
         'placeholder="'+esc(x.baseSets||'セット')+'" autocapitalize="off" spellcheck="false">'+
     '</div>'+
     '<div class="phbox" id="phedit-'+esc(id)+'"></div>'+
     '</div>';
  return h;
}

function bindSel(){
  var box=$('selList');
  if(!box) return;

  Array.prototype.forEach.call(box.querySelectorAll('[data-del]'),function(b){
    b.addEventListener('click',function(){
      var mi=Number(b.dataset.dmi), id=b.dataset.del;
      var m=S.menus[mi]; if(!m) return;
      var at=m.ids.indexOf(id);
      if(at>=0) m.ids.splice(at,1);
      renderSel();
    });
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-photo]'),function(b){
    b.addEventListener('click',function(){ togglePhotoEdit(b.dataset.photo); });
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-how]'),function(b){
    b.addEventListener('click',function(ev){ ev.stopPropagation(); toggleHowEdit(b.dataset.how); });
  });
  /* 回数・セット数は打つたびに覚えておく。並べかえても消えない */
  Array.prototype.forEach.call(box.querySelectorAll('[data-rp]'),function(b){
    b.addEventListener('input',function(){ setRep(b.dataset.rp,'reps',b.value); });
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-rs]'),function(b){
    b.addEventListener('input',function(){ setRep(b.dataset.rs,'sets',b.value); });
  });
  /* メニューの名前。こちらの覚え書きで、受講生には出ない */
  Array.prototype.forEach.call(box.querySelectorAll('[data-mn]'),function(b){
    b.addEventListener('input',function(){
      var m=S.menus[Number(b.dataset.mn)];
      if(m) m.name=String(b.value||'').trim();
    });
  });
  /* 種目を足す先を選ぶ。ボタンを押しても、メニューのどこかを触っても移る */
  Array.prototype.forEach.call(box.querySelectorAll('[data-mpick]'),function(b){
    b.addEventListener('click',function(){ pickMenu(Number(b.dataset.mpick)); });
  });
  /* メニューの中のどこかを触ったら、そこが選ばれる。
     描き直さず印だけ付け替える（打ちかけの数字を消さないため） */
  if(!box.__pickHooked){
    box.__pickHooked = true;
    box.addEventListener('click', function(e){
      var t = e.target;
      if(!t || !t.closest) return;
      if(t.closest('[data-mdel]')) return;          /* 消すボタンは別あつかい */
      var mb = t.closest('.mblock');
      if(!mb) return;
      var mi = Number(mb.dataset.mi);
      if(isNaN(mi)) return;
      pickMenu(mi);
    }, true);
  }
  /* メニューごと消す */
  Array.prototype.forEach.call(box.querySelectorAll('[data-mdel]'),function(b){
    b.addEventListener('click',function(){
      var mi=Number(b.dataset.mdel), m=S.menus[mi];
      if(!m) return;
      if(m.ids.length && !confirm('メニュー'+(mi+1)+'の '+m.ids.length+' 種目を消します。よろしいですか？')) return;
      S.menus.splice(mi,1);
      if(!S.menus.length) S.menus=[{ name:'', ids:[] }];
      if(S.cur>=S.menus.length) S.cur=S.menus.length-1;
      renderSel();
    });
  });
  bindDrag(box);
}

/* つまみを押したまま動かして並べかえる。
   ⠿（種目の左）… その種目を動かす。別のメニューへ移してもよい
   ⠿（メニューの見出し）… メニューをまるごと動かす（順ぐりに出る順が変わる） */
function bindDrag(box){
  if(box.__dragHooked) return;        /* 描き直すたびに増やさない。
                                         増えると dragging が外れず、押せなくなる */
  box.__dragHooked = true;
  var drag=null, kind=null, fromBox=null;

  function isWide(){ return window.innerWidth > 860; }  /* パソコンの幅なら横並び */

  box.addEventListener('pointerdown',function(e){
    var t=e.target;
    var mg=t&&t.closest?t.closest('[data-mgrip]'):null;
    var g =t&&t.closest?t.closest('[data-grip]') :null;
    if(mg){
      drag=mg.closest('.mblock'); kind='menu';
    }else if(g){
      drag=g.closest('.exrow');   kind='ex'; fromBox=drag?drag.parentNode:null;
    }else return;
    if(!drag){ kind=null; return; }
    e.preventDefault();
    drag.classList.add('dragging');
    try{ (mg||g).setPointerCapture(e.pointerId); }catch(err){}
  });

  box.addEventListener('pointermove',function(e){
    if(!drag) return;
    e.preventDefault();
    /* 画面の端まで来たら、少しずつ動かす */
    if(e.clientY < 96) window.scrollBy(0,-14);
    else if(e.clientY > window.innerHeight-96) window.scrollBy(0,14);
    if(isWide()){
      if(e.clientX < 70) box.scrollBy(-18,0);
      else if(e.clientX > window.innerWidth-70) box.scrollBy(18,0);
    }
    var el=document.elementFromPoint(e.clientX, e.clientY);
    if(!el || !el.closest) return;

    if(kind==='menu'){
      var om=el.closest('.mblock');
      if(!om || om===drag || om.parentNode!==drag.parentNode) return;
      var rm=om.getBoundingClientRect();
      var after = isWide() ? (e.clientX > rm.left + rm.width/2)
                             : (e.clientY > rm.top  + rm.height/2);
      om.parentNode.insertBefore(drag, after ? om.nextSibling : om);
      return;
    }

    /* 種目。同じメニューの中でも、別のメニューへでも動かせる */
    var over=el.closest('.exrow');
    if(over && over!==drag){
      var r=over.getBoundingClientRect();
      over.parentNode.insertBefore(drag, (e.clientY > r.top + r.height/2) ? over.nextSibling : over);
      return;
    }
    var ob=el.closest('.mbox');
    if(ob && ob!==drag.parentNode){
      var em=ob.querySelector('.empty');
      if(em) em.parentNode.removeChild(em);
      ob.appendChild(drag);
    }
  });

  function end(){
    if(!drag) return;
    var wasMenu = (kind==='menu');
    var moved   = (kind==='ex' && fromBox && drag.parentNode!==fromBox);
    drag.classList.remove('dragging');
    drag=null; kind=null; fromBox=null;
    commitOrder();                       /* 画面の並びをデータへ写す */
    if(wasMenu) commitMenuOrder();       /* メニューの順番も入れ替える */
    else if(moved) renderSel();          /* 別のメニューへ移したら番号と種目数を出し直す */
  }
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  /* 箱の外で指を離したときも必ず終わらせる。終わらないと押せなくなる */
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
}

/* さがした一覧から、メニューの箱へドラッグして入れる。
   行そのものは動かさない。指の下に小さな札を出して、落ちた先のメニューへ足す */
function bindFindDrag(){
  var box=$('found'); if(!box || box.__dragHooked) return;
  box.__dragHooked = true;
  var id=null, ghost=null, lastBox=null;

  function clearMark(){
    Array.prototype.forEach.call(document.querySelectorAll('.mblock.droptarget'),
      function(e){ e.classList.remove('droptarget'); });
  }
  box.addEventListener('pointerdown',function(e){
    var g=e.target&&e.target.closest?e.target.closest('[data-fgrip]'):null;
    if(!g) return;
    e.preventDefault();
    id=g.dataset.fgrip;
    ghost=document.createElement('div');
    ghost.className='dragghost';
    ghost.textContent=id;
    document.body.appendChild(ghost);
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    try{ g.setPointerCapture(e.pointerId); }catch(err){}
  });
  box.addEventListener('pointermove',function(e){
    if(!id) return;
    e.preventDefault();
    if(ghost){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; }
    if(e.clientY < 96) window.scrollBy(0,-16);
    else if(e.clientY > window.innerHeight-96) window.scrollBy(0,16);
    var el=document.elementFromPoint(e.clientX, e.clientY);
    var mb=el&&el.closest?el.closest('.mblock'):null;
    if(mb!==lastBox){ clearMark(); if(mb) mb.classList.add('droptarget'); lastBox=mb; }
  });
  function end(e){
    if(!id) return;
    var drop=lastBox;
    if(ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    ghost=null; clearMark(); lastBox=null;
    var theId=id; id=null;
    if(!drop) return;                      /* メニューの外で離したら何もしない */
    var mi=Number(drop.dataset.mi);
    if(isNaN(mi)) return;
    S.cur=mi;
    addToSel(theId);
  }
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', function(){
    if(ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    ghost=null; id=null; clearMark(); lastBox=null;
  });
  window.addEventListener('pointerup', function(e){ if(id) end(e); });
}

/* 種目を足す先のメニューを切り替える。印とボタンの文字だけ書き換える */
function pickMenu(mi){
  if(isNaN(mi) || mi === S.cur) return;
  S.cur = mi;
  var box = $('selList'); if(!box) return;
  Array.prototype.forEach.call(box.querySelectorAll('.mblock'), function(b){
    var on = (Number(b.dataset.mi) === S.cur);
    if(on) b.classList.add('cur'); else b.classList.remove('cur');
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-mpick]'), function(b){
    var on = (Number(b.dataset.mpick) === S.cur);
    b.textContent = on ? 'ここに足します' : 'ここに足す';
    if(on) b.classList.add('fill'); else b.classList.remove('fill');
  });
  var sb = $('btnSort');
  if(sb && S.menus.length > 1){
    sb.textContent = 'メニュー' + (S.cur + 1) + 'を 緩める→伸ばす→支える→鍛える の順に並べる';
  }
}

/* 画面に並んでいるメニューの順番を、持っているデータへ写す */
function commitMenuOrder(){
  var box=$('selList'); if(!box) return;
  var cur = S.menus[S.cur];
  var next = [];
  Array.prototype.forEach.call(box.querySelectorAll('.mblock'),function(b){
    var m = S.menus[Number(b.dataset.mi)];
    if(m) next.push(m);
  });
  if(next.length !== S.menus.length) return;   /* 数が合わないときは触らない */
  S.menus = next;
  var at = S.menus.indexOf(cur);
  S.cur = at >= 0 ? at : 0;
  renderSel();
  toast('メニューの順番を入れ替えました');
}

/* 画面の並びを、持っているデータへ写して番号を振り直す */
function commitOrder(){
  (S.menus||[]).forEach(function(m, mi){
    var b=document.getElementById('mbox-'+mi);
    if(!b) return;
    var rows=b.querySelectorAll('.exrow');
    m.ids=Array.prototype.map.call(rows,function(e){ return e.dataset.exid; });
    Array.prototype.forEach.call(rows,function(e,i){
      var n=e.querySelector('.no');
      if(n) n.textContent=(i+1);
    });
  });
}

/* 打った回数を覚える。保存は「この内容で出す」でまとめて */
function setRep(id, key, val){
  S.reps = S.reps || {};
  S.reps[id] = S.reps[id] || { reps:'', sets:'' };
  S.reps[id][key] = String(val||'').trim();
}

/* 足すときは、いま選んでいるメニューの中の
 * 緩める→伸ばす→支える→鍛える の並びに収まる場所へ入れる。
 * 並びを変えたければ、あとから ⠿ で動かせる */
function addToSel(id){
  if(!S.menus || !S.menus.length) S.menus=[{ name:'', ids:[] }];
  if(S.cur==null || S.cur>=S.menus.length) S.cur=0;
  var m = S.menus[S.cur];
  if(m.ids.indexOf(id)>=0){ toast('このメニューにもう入っています'); return; }
  var r = PH_NO[(S.selInfo[id]||{}).phase||''] || 99;
  var at = m.ids.length;
  for(var i=0;i<m.ids.length;i++){
    var ri = PH_NO[(S.selInfo[m.ids[i]]||{}).phase||''] || 99;
    if(ri > r){ at = i; break; }
  }
  m.ids.splice(at, 0, id);
  renderSel();
  toast((S.menus.length>1?'メニュー'+(S.cur+1)+'の ':'')+(at+1)+'番目に足しました');
}

/* 写真の入れかえ。変な写真が混ざっていたら、その1枚だけ消せる */
function togglePhotoEdit(id){
  var box = $('phedit-'+id);
  if(!box) return;
  if(box.innerHTML){ box.innerHTML=''; return; }
  drawPhotoEdit(id);
}

function drawPhotoEdit(id){
  var box = $('phedit-'+id);
  if(!box) return;
  var x = S.selInfo[id] || {};
  var ps = x.photos || [];
  var h='<div class="ph-edit">';

  h+='<div class="ex-body"><b>'+esc(id)+'</b> の写真。いらないものは × で消せます。<br>'+
     'マスターから消えるので、ほかの受講生の画面でも消えます</div>';
  if(ps.length){
    h+='<div class="shots">';
    ps.forEach(function(u,i){
      h+='<div class="shot"><img src="'+esc(thumb(u,300))+'" loading="lazy" decoding="async" alt="">'+
         '<span class="n">'+(i+1)+'</span>'+
         '<button class="x" data-ph="'+esc(id)+'" data-i="'+i+'">×</button></div>';
    });
    h+='</div>';
  } else {
    h+='<div class="ex-body" style="opacity:.7">まだ写真はありません</div>';
  }
  if(ps.length < 5){
    h+='<button class="mini fill" data-addph="'+esc(id)+'" style="margin-top:9px;">'+
       '写真を足す（あと'+(5-ps.length)+'枚）</button>';
  }

  h+='<div class="field" style="margin-top:14px;"><label>コツ（受講生にも出ます）</label>'+
     '<textarea data-tips="'+esc(id)+'" placeholder="意識するところ・注意点">'+esc(x.tips||'')+'</textarea></div>'+
     '<div class="field"><label>コーチ用メモ（指導中のカンペ。受講生には出ません）</label>'+
     '<textarea data-note="'+esc(id)+'" placeholder="見るところ・声かけ・よくある崩れかた・代わりにやってもらう種目 など">'+
       esc(x.note||'')+'</textarea>'+
     '<button class="mini" data-savenote="'+esc(id)+'" style="margin-top:6px;">コツとメモを保存</button></div>';
  h+='</div>';
  box.innerHTML=h;

  Array.prototype.forEach.call(box.querySelectorAll('[data-ph]'),function(b){
    b.addEventListener('click',function(){ delPhoto(b.dataset.ph, Number(b.dataset.i), b); });
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-addph]'),function(b){
    b.addEventListener('click',function(){
      S.addPhotoFor = b.dataset.addph;
      $('fileAdd').click();
    });
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-savenote]'),function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.savenote;
      var tn=box.querySelector('[data-note="'+k+'"]');
      var tt=box.querySelector('[data-tips="'+k+'"]');
      var note=tn?tn.value:'', tips=tt?tt.value:'';
      b.disabled=true; b.textContent='保存しています…';
      api('coachSetNote',{data:{exId:k, note:note, tips:tips}}).then(function(){
        if(S.selInfo[k]){ S.selInfo[k].note=note; S.selInfo[k].tips=tips; }
        toast('保存しました');
      }).catch(function(e){ toast(String(e.message||'保存できませんでした')); })
      .then(function(){ b.disabled=false; b.textContent='コツとメモを保存'; });
    });
  });
}

/* すでにある種目に写真を足す。スプレッドシートに貼らなくていい */
$('fileAdd').addEventListener('change',function(){
  var files=Array.prototype.slice.call(this.files);
  this.value='';
  var id=S.addPhotoFor;
  if(!id || !files.length) return;
  var have=((S.selInfo[id]||{}).photos||[]).length;
  var room=5-have;
  if(room<=0){ toast('写真は5枚までです'); return; }

  toast('写真を送っています…');
  var out=[], chain=Promise.resolve();
  files.slice(0,room).forEach(function(f){
    chain=chain.then(function(){ return shrink(f).then(function(b){ out.push(b.base64); }); });
  });
  chain.then(function(){
    return api('coachAddPhoto',{data:{exId:id, photos:out}});
  }).then(function(r){
    if(S.selInfo[id]) S.selInfo[id].photos=r.photos;
    toast(r.added+'枚 足しました');
    renderSel();
    togglePhotoEdit(id);
  }).catch(function(e){ toast(String(e.message||'足せませんでした')); });
});

function delPhoto(id, i, btn){
  if(!confirm(id+' の '+(i+1)+'枚目を消します。元に戻せません。よろしいですか？')) return;
  btn.disabled = true;
  api('coachDelPhoto',{data:{exId:id, index:i}}).then(function(r){
    if(S.selInfo[id] && S.selInfo[id].photos) S.selInfo[id].photos.splice(i,1);
    toast('消しました。のこり '+r.left+'枚');
    renderSel();
    drawPhotoEdit(id);
  }).catch(function(e){
    btn.disabled = false;
    toast('消せませんでした：'+String(e.message||e));
  });
}

  h+='</div></div>'+
     '<div class="field"><label>コツ（受講生にも出ます）</label>'+
     '<textarea id="nTips" placeholder="意識するところ・注意点"></textarea></div>'+
     '<div class="field"><label>コーチ用メモ（指導中のカンペ。受講生には出ません）</label>'+
     '<textarea id="nNote" placeholder="見るところ・声かけ・よくある崩れかた・代わりにやってもらう種目 など"></textarea></div>'+
     '<button class="btn-save" id="btnSaveEx" style="margin-top:12px;">この種目を登録する</button></div>';
  $('view-coach').innerHTML=h;
  $('btnBack2').addEventListener('click', renderCoachHome);
  $('btnPickEx').addEventListener('click',function(){ $('fileEx').click(); });
  $('btnSaveEx').addEventListener('click', saveNewEx);
  window.scrollTo(0,0);
}

$('fileEx').addEventListener('change',function(){
  var files=Array.prototype.slice.call(this.files); if(!files.length) return;
  var room=5-(S.newPhotos||[]).length;
  if(room<=0){ toast('写真は5枚までです'); return; }
  var chain=Promise.resolve();
  files.slice(0,room).forEach(function(f){
    chain=chain.then(function(){
      return shrink(f).then(function(b){ S.newPhotos.push(b); drawNewShots(); });
    });
  });
  this.value='';
});

function drawNewShots(){
  var h='';
  (S.newPhotos||[]).forEach(function(b,i){
    h+='<div class="shot"><img src="'+b.dataUrl+'" alt=""><span class="n">'+(i+1)+'</span></div>';
  });
  var el=$('newShots'); if(el) el.innerHTML=h;
}

function saveNewEx(){
  var how=$('nHow').value.trim();
  if(how.length<4){ toast('やり方を書いてください'); return; }
  var sub=['nSub1','nSub2','nSub3'].map(function(id){ return $(id).value; })
          .filter(function(x){ return x; });
  $('btnSaveEx').disabled=true;
  toast('登録しています…');
  api('coachAddEx',{data:{
    how:how, reps:$('nReps').value, sets:$('nSets').value,
    phase:$('nPhase').value, body:$('nBody').value, sub:sub,
    tips:$('nTips').value, note:$('nNote').value,
    photos:(S.newPhotos||[]).map(function(b){ return b.base64; })
  }}).then(function(r){
    toast(r.id+' で登録しました');
    renderCoachHome();
  }).catch(function(e){
    $('btnSaveEx').disabled=false;
    toast(String(e.message||'登録できませんでした'));
  });
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function alert2(msg){ toast(msg); }

/* 起動。defer の SDK が読み終わったあとに動く */
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
</html>
